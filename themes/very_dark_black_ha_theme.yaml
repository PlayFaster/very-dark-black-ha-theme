---
# THEME METADATA
# Name: Very Dark Black HA Theme
# HA Support: 2025.1–2026.4+ (HSL scales require 2026+)
# Dependencies: card-mod (optional, for scrollbars & borders)
# Last Updated: 2026-04-29
# ----------------------------------------------------------------
# VERY DARK BLACK THEME
# ----------------------------------------------------------------

# Black Base (Shared Config) - Utility theme for inheritance
Black Base (Shared Config):
  &base_config # --- 1. Dashboard Background & System Branding ---
  lovelace-background: &base_black "#000000"
  primary-background-color: *base_black
  secondary-background-color: &base_surface "#0a0a0a"
  app-header-background-color: *base_black
  app-header-text-color: "#ffffff"
  sidebar-background-color: *base_black
  app-theme-color: *base_black

  # --- 14. Named Colors (Anchors defined early to prevent alias errors) ---
  red-color: &acc_red "#f44336"
  green-color: &acc_green "#4caf50"
  blue-color: "#2196f3"
  orange-color: &acc_orange "#ff9800"
  pink-color: "#e91e63"
  purple-color: &acc_purple "#9c27b0"
  amber-color: "#ffc107"
  cyan-color: &acc_cyan "#00bcd4"
  teal-color: "#009688"
  fuchsia-color: &acc_fuchsia "#ff00ff"
  indigo-color: &acc_indigo "#5c6bc0"
  silver-color: &acc_silver "#e0e0e0"

  # --- 2. Card Backgrounds & Borders ---
  ha-card-background: *base_black
  card-background-color: *base_black
  ha-card-border-color: &base_glass_border "rgba(255, 255, 255, 0.12)"
  ha-card-border-width: "0.5px"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "none"
  # Granular Radius Scale
  token-size-radius-small: "8px"
  token-size-radius-medium: "12px"
  token-size-radius-large: "16px"

  # --- 3. Text, Icons & Typography ---
  primary-text-color: &base_text "#e1e1e1"
  secondary-text-color: &base_subtext "#a8a8a8" # Brightened for WCAG AA safety
  # Icons & Accents mapping to primary-color
  accent-color: var(--primary-color)
  paper-item-icon-color: var(--primary-color)
  state-icon-color: var(--primary-color)
  state-icon-active-color: var(--primary-color)
  # state-active-color is defined in individual themes to avoid YAML merge warnings
  sidebar-selected-icon-color: var(--primary-color)
  sidebar-selected-text-color: var(--primary-color)
  mdc-theme-primary: var(--primary-color)
  paper-item-icon-active-color: var(--primary-color)
  sl-color-primary-base: var(--primary-color)
  mdc-ripple-color: var(--primary-color)
  mdc-icon-button-ripple-opacity: "0.08"
  ha-font-weight-heading: "500"
  ha-font-weight-medium: "500"
  ha-font-weight-action: "500"
  title-font-weight: "500"
  ha-font-smoothing: "antialiased"

  # --- 4. Sidebar & Navigation ---
  sidebar-icon-color: *base_subtext
  sidebar-text-color: *base_text

  # --- 5. Control States (Off/Unselected) ---
  paper-radio-button-unchecked-color: &acc_graphite "#444444"
  paper-checkbox-unchecked-color: *acc_graphite
  control-item-icon-color: "#ffffff"
  switch-unchecked-button-color: &acc_medium "#666666"
  switch-unchecked-track-color: &acc_charcoal "#333333"
  mdc-switch-unselected-icon-color: "#ffffff"
  mdc-switch-unselected-track-color: *acc_charcoal
  mdc-switch-unselected-handle-color: *acc_medium

  # --- 6. System UI (Menus/Dialogs/Selections) ---
  divider-color: "#222222"
  outline-color: *acc_charcoal
  mdc-dialog-scrim-color: "rgba(0,0,0,0.9)"
  dialog-box-shadow: "none"
  mdc-theme-surface: *base_black
  mdc-theme-on-surface: *base_text
  mdc-theme-background: *base_black
  ha-dialog-surface-background: *base_black
  paper-dialog-background-color: *base_black
  mdc-ripple-hover-opacity: "0.08"
  mdc-list-item-hover-leading-icon-color: "#ffffff"
  mdc-list-item-selected-container-color: *acc_charcoal
  # Data Table Styling
  data-table-background-color: *base_black
  mdc-data-table-header-cell-font-weight: "600"

  # --- 7. Inputs & Text Fields ---
  mdc-text-field-fill-color: *base_black
  mdc-text-field-ink-color: "#ffffff"
  mdc-text-field-label-ink-color: *base_subtext
  mdc-text-field-outline-color: *acc_graphite
  mdc-select-fill-color: *base_black
  mdc-select-ink-color: "#ffffff"
  mdc-select-outline-color: *acc_graphite
  ha-select-fill-color: *base_black
  ha-textfield-fill-color: *base_black
  input-fill-color: *base_black
  md-sys-color-surface-container-highest: *base_black
  md-sys-color-surface-container: *base_black
  sl-input-filled-background-color: *base_black
  sl-input-background-color: *base_black
  ha-filled-text-field-fill-color: *base_black
  ha-filled-select-fill-color: *base_black
  md-sys-color-surface-container-high: *base_black
  md-sys-color-surface-variant: *base_black
  md-sys-color-surface-container-low: *base_black
  md-sys-color-surface-container-lowest: *base_black
  ha-color-form-background: *base_black
  ha-color-form-background-hover: *base_black
  ha-color-form-background-disabled: *base_black
  input-dropdown-icon-color: "#ffffff"
  input-label-ink-color: "#ffffff"
  input-idle-line-color: "transparent"
  mdc-select-idle-line-color: "transparent"
  mdc-text-field-idle-line-color: "transparent"
  wa-text-field-fill-background-color: *base_black
  wa-select-fill-background-color: *base_black
  # Inset depth for modern look
  ha-textfield-border-radius: var(--token-size-radius-small)
  ha-select-border-radius: var(--token-size-radius-small)
  ha-color-form-outline: var(--ha-card-border-color)
  ha-color-form-outline-hover: var(--primary-color)

  # --- 8. Lists & Notifications ---
  paper-listbox-background-color: *base_black
  paper-listbox-color: "#ffffff"
  mdc-snackbar-container-color: &base_border "#1a1a1a"
  mdc-snackbar-content-ink-color: "#ffffff"

  # --- 9. Mode Handling ---
  theme-base: dark
  modes:
    dark: {}
    light: {}

  # --- 10. 2026.4 Semantic & Web Awesome Tokens ---
  wa-color-surface-raised: *base_surface
  ha-color-fill-neutral-quiet-resting: *base_black
  ha-color-fill-neutral-quiet-hover: *base_surface
  ha-color-fill-neutral-quiet-active: *base_black
  ha-color-fill-neutral-normal-resting: *base_surface
  ha-color-fill-neutral-normal-hover: "#151515"
  ha-color-fill-neutral-normal-active: *base_surface
  # 2026+ Material 3 Semantic Tokens
  md-sys-color-on-surface-variant: var(--secondary-text-color)
  md-sys-color-outline-variant: *acc_graphite
  md-sys-color-error: *acc_red
  md-sys-color-on-error: "#ffffff"
  md-sys-color-warning: *acc_orange
  md-sys-color-success: *acc_green
  md-sys-color-info: "#2196f3"

  # --- 11. Global Color Scales (Neutral & Primary) ---
  # NOTE: hsl(from ...) syntax requires HA 2026.4+ / Modern Browser
  ha-color-neutral-05: hsl(from var(--secondary-text-color) h s calc(l * 0.15))
  ha-color-neutral-10: hsl(from var(--secondary-text-color) h s calc(l * 0.25))
  ha-color-neutral-20: hsl(from var(--secondary-text-color) h s calc(l * 0.40))
  ha-color-neutral-30: hsl(from var(--secondary-text-color) h s calc(l * 0.70))
  ha-color-neutral-40: var(--secondary-text-color)
  ha-color-neutral-50: hsl(from var(--secondary-text-color) h s calc(l * 1.15))
  ha-color-neutral-60: hsl(from var(--secondary-text-color) h s calc(l * 1.30))
  ha-color-neutral-70: hsl(from var(--secondary-text-color) h s calc(l * 1.45))
  ha-color-neutral-80: hsl(from var(--secondary-text-color) h s calc(l * 1.60))
  ha-color-neutral-90: hsl(from var(--secondary-text-color) h s calc(l * 1.75))
  ha-color-neutral-95: hsl(from var(--secondary-text-color) h s calc(l * 1.90))

  ha-color-primary-05: hsl(from var(--primary-color) h s calc(l * 0.15))
  ha-color-primary-10: hsl(from var(--primary-color) h s calc(l * 0.25))
  ha-color-primary-20: hsl(from var(--primary-color) h s calc(l * 0.40))
  ha-color-primary-30: hsl(from var(--primary-color) h s calc(l * 0.70))
  ha-color-primary-40: var(--primary-color)
  ha-color-primary-50: var(--primary-color)
  ha-color-primary-60: hsl(from var(--primary-color) h s calc(l * 1.15))
  ha-color-primary-70: hsl(from var(--primary-color) h s calc(l * 1.30))
  ha-color-primary-80: hsl(from var(--primary-color) h s calc(l * 1.45))
  ha-color-primary-90: hsl(from var(--primary-color) h s calc(l * 1.60))
  ha-color-primary-95: hsl(from var(--primary-color) h s calc(l * 1.75))

  # --- 12. Energy Dashboard Colors ---
  energy-grid-consumption-color: "#2196f3" # Blue
  energy-grid-return-color: "#9c27b0" # Purple
  energy-solar-color: "#ff9800" # Orange
  energy-non-fossil-color: "#4caf50" # Green
  energy-battery-out-color: "#00bcd4" # Cyan
  energy-battery-in-color: "#9c27b0" # Purple
  energy-gas-color: "#f44336" # Red
  energy-water-color: "#00bcd4" # Cyan

  # --- 13. Graph Series Colors ---
  graph-color-1: var(--primary-color)
  graph-color-2: "#2196f3"
  graph-color-3: "#4caf50"
  graph-color-4: "#9c27b0"
  graph-color-5: "#f44336"
  graph-color-6: "#00bcd4"
  graph-color-7: "#009688"
  graph-color-8: "#e91e63"
  graph-color-9: "#ff5722"
  graph-color-10: "#3f51b5"

  # --- 15. Disabled Fills ---
  ha-color-fill-disabled-normal-resting: "rgba(155, 155, 155, 0.08)"
  ha-color-on-disabled-normal: "rgba(155, 155, 155, 0.5)"

  # --- 16. Global Card-Mod ---
  card-mod-card: |
    ha-card {
      background-color: #000000 !important;
      border-width: var(--ha-card-border-width) !important;
      border-style: solid !important;
      border-color: var(--ha-card-border-color) !important;
    }
    /* Component Exclusions for Transparent Cards */
    :host(hui-heading-card) ha-card,
    :host(hui-glance-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(.type-custom-bubble-card) ha-card,
    :host(mushroom-chips-card) ha-card,
    :host(hui-conditional-card) ha-card,
    :host(custom-button-card) ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .card-header {
      background-color: #000000 !important;
      color: #ffffff !important;
      font-weight: var(--ha-font-weight-heading) !important;
    }
    :host {
      --scrollbar-thumb-color: #333333 !important;
      color-scheme: dark !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
    }
    *::-webkit-scrollbar { width: 4px !important; }
    *::-webkit-scrollbar-thumb {
      background-color: #333333 !important;
      border-radius: 8px !important;
    }
    /* Subtle Inset Shadow for Inputs */
    ha-textfield, ha-select, input {
      --ha-textfield-box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
      --ha-select-box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
    }
    /* Data Table & List Refinements */
    .mdc-data-table__header-cell {
      background-color: #050505 !important;
      border-bottom: 1px solid var(--divider-color) !important;
    }
    .mdc-data-table__row:hover {
      background-color: rgba(255, 255, 255, 0.02) !important;
    }

  card-mod-more-info: |
    /* Note: Brittle selector, may require adjustment in future HA versions */
    ha-card-picker $ ha-sub-page ha-icon-button-prev-next + h1 + div {
        background-color: #000000 !important;
    }
    ha-more-info-dialog $ ha-dialog,
    ha-more-info-dialog $ wa-dialog {
        --mdc-dialog-heading-ink-color: #ffffff;
        --mdc-theme-on-surface: #ffffff;
    }

# ----------------------------------------------------------------
# THE INDIVIDUAL THEMES
# ----------------------------------------------------------------

# 1. MAIN CYAN
Black with Cyan:
  <<: *base_config
  card-mod-theme: "Black Main"
  primary-color: *acc_cyan
  state-active-color: var(--primary-color)

# 2. MAIN GREEN
Black with Green:
  <<: *base_config
  card-mod-theme: "Black Green"
  primary-color: *acc_green
  state-active-color: var(--primary-color)

# 3. MAIN RED
Black with Red:
  <<: *base_config
  card-mod-theme: "Black Red"
  primary-color: *acc_red
  state-active-color: var(--primary-color)

# 4. MAIN FUCHSIA
Black with Fuchsia:
  <<: *base_config
  card-mod-theme: "Black Fuchsia"
  primary-color: *acc_fuchsia
  state-active-color: var(--primary-color)

# 5. PURPLE
Black with Purple:
  <<: *base_config
  card-mod-theme: "Black Purple"
  primary-color: *acc_purple
  state-active-color: var(--primary-color)

# 6. INDIGO
Black with Indigo:
  <<: *base_config
  card-mod-theme: "Black Indigo"
  primary-color: *acc_indigo
  state-active-color: var(--primary-color)

# 7. SILVER (Monochrome)
Black with Silver:
  <<: *base_config
  card-mod-theme: "Black Silver"
  primary-color: *acc_silver
  state-active-color: var(--primary-color)

# 8. ORANGE (with Red accents)
Black with Orange:
  <<: *base_config
  card-mod-theme: "Black Orange"
  primary-color: *acc_orange
  state-active-color: *acc_red
  state-switch-active-color: *acc_red
  state-plug-active-color: *acc_red
  state-binary_sensor-active-color: *acc_red

# 9. MORE CONTRAST (Indigo)
Black More Contrast:
  <<: *base_config
  card-mod-theme: "Black Contrast"
  primary-color: *acc_indigo
  state-active-color: var(--primary-color)
  # --- Option 1: Surface Elevation (Dialogs & Menus) ---
  ha-dialog-surface-background: "#1c1c1c"
  paper-dialog-background-color: "#1c1c1c"
  mdc-theme-surface: "#1c1c1c"
  wa-color-surface-raised: "#1c1c1c"
  # --- Option 2: Semantic Accent Framing (Outlines) ---
  ha-color-form-outline: var(--primary-color)
  ha-color-form-outline-hover: var(--primary-color)
  mdc-text-field-outline-color: var(--primary-color)
  mdc-select-outline-color: var(--primary-color)
  # --- Additional High Contrast Refinements ---
  # 2. Structural Separators
  divider-color: "rgba(255, 255, 255, 0.2)"
  ha-card-border-color: "rgba(255, 255, 255, 0.25)"
  input-dropdown-icon-color: var(--primary-color)
  # 3. Interactive Feedback
  paper-slider-knob-color: var(--primary-color)
  paper-slider-pin-color: var(--primary-color)
  paper-toggle-button-unchecked-bar-color: "#444444"
  mdc-ripple-hover-opacity: "0.15"
  # 4. Depth & Focus
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.7)"
  mdc-list-item-selected-container-color: "rgba(255, 255, 255, 0.1)"
