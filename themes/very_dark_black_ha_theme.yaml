---
# ----------------------------------------------------------------
# VERY DARK BLACK THEME
# ----------------------------------------------------------------

# Black Base (Shared Config) - Utility theme for inheritance
Black Base (Shared Config): &base_config
  lovelace-background: &base_black "#000000"
  primary-background-color: *base_black
  secondary-background-color: &base_surface "#0a0a0a"
  app-header-background-color: *base_black
  sidebar-background-color: *base_black
  app-theme-color: *base_black

  ha-card-background: *base_black
  card-background-color: *base_black
  ha-card-border-color: &base_glass_border "rgba(234, 235, 238, 0.15)"
  ha-card-border-width: "0.5px"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "none"

  primary-text-color: &base_text "#e1e1e1"
  secondary-text-color: &base_subtext "#9b9b9b"
  paper-item-icon-color: &base_icon "#ffffff"
  ha-font-weight-heading: "500"
  ha-font-weight-medium: "500"
  title-font-weight: "500"

  sidebar-icon-color: *base_subtext
  sidebar-text-color: *base_text
  sidebar-selected-text-color: *base_icon

  paper-radio-button-unchecked-color: &acc_graphite "#444444"
  paper-checkbox-unchecked-color: *acc_graphite
  control-item-icon-color: *base_icon
  switch-unchecked-button-color: &acc_medium "#666666"
  switch-unchecked-track-color: &acc_charcoal "#333333"
  mdc-switch-unselected-icon-color: *base_icon
  mdc-switch-unselected-track-color: *acc_charcoal
  mdc-switch-unselected-handle-color: *acc_medium

  divider-color: "#222222"
  outline-color: *acc_charcoal
  mdc-dialog-scrim-color: "rgba(0,0,0,0.8)"
  mdc-theme-surface: *base_black
  mdc-theme-on-surface: *base_text
  mdc-theme-background: *base_black
  ha-dialog-surface-background: *base_black
  paper-dialog-background-color: *base_black
  mdc-ripple-hover-opacity: "0.1"
  mdc-ripple-color: *acc_charcoal

  # Inputs & Text Fields
  mdc-text-field-fill-color: *base_black
  mdc-text-field-ink-color: *base_icon
  mdc-text-field-label-ink-color: *base_subtext
  mdc-text-field-outline-color: *acc_graphite
  mdc-select-fill-color: *base_black
  mdc-select-ink-color: *base_icon
  mdc-select-outline-color: *acc_graphite
  input-idle-line-color: "transparent"
  mdc-select-idle-line-color: "transparent"
  mdc-text-field-idle-line-color: "transparent"

  paper-listbox-background-color: *base_black
  paper-listbox-color: *base_icon
  mdc-snackbar-container-color: &base_border "#1a1a1a"
  mdc-snackbar-content-ink-color: *base_icon

  theme-base: dark
  modes:
    dark: {}

  card-mod-card: |
    ha-card {
      background-color: #000000 !important;
      border-width: var(--ha-card-border-width) !important;
      border-style: solid !important;
      border-color: var(--ha-card-border-color) !important;
    }
    .card-header {
      background-color: #000000 !important;
      color: #ffffff !important;
      font-weight: var(--ha-font-weight-heading) !important;
    }
    :host {
      --scrollbar-thumb-color: #333333 !important;
      color-scheme: dark !important;
    }
    *::-webkit-scrollbar { width: 4px !important; }
    *::-webkit-scrollbar-thumb {
      background-color: #333333 !important;
      border-radius: 8px !important;
    }

  card-mod-more-info: |
    ha-card-picker $ ha-sub-page ha-icon-button-prev-next + h1 + div {
        background-color: #000000 !important;
    }
    ha-more-info-dialog $ ha-dialog {
        --mdc-dialog-heading-ink-color: #ffffff;
        --mdc-theme-on-surface: #ffffff;
    }

# ----------------------------------------------------------------
# THE INDIVIDUAL THEMES
# ----------------------------------------------------------------

