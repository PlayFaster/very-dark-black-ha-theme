# 2. MAIN GREEN
Black with Green:
  <<: *black_surfaces
  card-mod-theme: "Black with Green"
  primary-color: *acc_green
  state-active-color: var(--primary-color)

# 3. MAIN RED
Black with Red:
  <<: *black_surfaces
  card-mod-theme: "Black with Red"
  primary-color: *acc_red
  state-active-color: var(--primary-color)

# 4. MAIN FUCHSIA
Black with Fuchsia:
  <<: *black_surfaces
  card-mod-theme: "Black with Fuchsia"
  primary-color: *acc_fuchsia
  state-active-color: var(--primary-color)

# 5. PURPLE
Black with Purple:
  <<: *black_surfaces
  card-mod-theme: "Black with Purple"
  primary-color: *acc_purple
  state-active-color: var(--primary-color)

# 6. INDIGO
Black with Indigo:
  <<: *black_surfaces
  card-mod-theme: "Black with Indigo"
  primary-color: *acc_indigo
  state-active-color: var(--primary-color)

# 7. SILVER (Monochrome)
Black with Silver:
  <<: *black_surfaces
  card-mod-theme: "Black with Silver"
