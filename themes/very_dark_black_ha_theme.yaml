# ----------------------------------------------------------------
# ----------------------------------------------------------------
# THE MASTER PALETTE (Define your hex codes once here)
# ----------------------------------------------------------------
_colors:
  black: &base_black "#000000"           # Pure Black
  dark_grey: &base_surface "#0a0a0a"     # Extremely dark grey (Settings/Tabs)
  border_grey: &base_border "#1a1a1a"    # Very dark grey (Standard Border)
  glass_border: &base_glass_border "rgba(234, 235, 238, 0.15)"  # Subtle Glass Edge
  text_white: &base_text "#e1e1e1"       # Off-white (Text)
  text_grey: &base_subtext "#9b9b9b"     # Medium grey (Sub-text)
  icon_white: &base_icon "#ffffff"       # Pure White (Icons)

  # Accents
  cyan: &acc_cyan "#00bcd4"              # Cyan / Light Blue
  green: &acc_green "#4caf50"            # Green
  red: &acc_red "#f44336"                # Red
  fuchsia: &acc_fuchsia "#ff00ff"        # Fuchsia (Backup)
  orange: &acc_orange "#ff9800"          # Orange (Test)
  graphite: &acc_graphite "#444444"      # Graphite Grey
  charcoal: &acc_charcoal "#333333"      # Dark Charcoal
  medium_grey: &acc_medium "#666666"     # Medium Grey

# ----------------------------------------------------------------
# THE SHARED CONFIGURATION (Anchor: &shared_config)
# ----------------------------------------------------------------
_shared_config: &shared_config
  theme-base: dark             # Forces HA to use dark fallback variables
  modes:
    dark: {}              # 2025 Fix: Forces browser to stay in dark-mode logic

  # 1. Dashboard Background & System Branding
  lovelace-background: *base_black       # #000000
  primary-background-color: *base_black
  secondary-background-color: *base_surface
  app-header-background-color: *base_black
  sidebar-background-color: *base_black
  app-theme-color: *base_black           # Browser status bar hint

  # 2. Card Backgrounds & Borders
  ha-card-background: *base_black
  card-background-color: *base_black
  ha-card-border-color: *base_glass_border
  ha-card-border-width: "0.5px"          # High-DPI "0.5px" Edge
  ha-card-border-radius: "12px"          # Refined corner radius
  ha-card-box-shadow: "none"

  # 3. Text, Icons & Typography Synchronization
  primary-text-color: *base_text         # #e1e1e1
  secondary-text-color: *base_subtext    # #9b9b9b
  paper-item-icon-color: *base_icon      # #ffffff
  ha-font-weight-heading: "500"
  ha-font-weight-medium: "500"
  title-font-weight: "500"               # Legacy card compatibility

  # 4. Sidebar & Navigation
  sidebar-icon-color: *base_subtext
  sidebar-text-color: *base_text
  sidebar-selected-text-color: *base_icon

  # 5. Control States (Off/Unselected)
  paper-radio-button-unchecked-color: *acc_graphite
  paper-checkbox-unchecked-color: *acc_graphite
  control-item-icon-color: *base_icon
  switch-unchecked-button-color: *acc_medium
  switch-unchecked-track-color: *acc_charcoal
  mdc-switch-unselected-icon-color: *base_icon
  mdc-switch-unselected-track-color: *acc_charcoal
  mdc-switch-unselected-handle-color: *acc_medium

  # 6. System UI (Menus/Dialogs/Selections)
  divider-color: "#222222"
  outline-color: *acc_charcoal
  mdc-dialog-scrim-color: "rgba(0,0,0,0.8)"
  mdc-theme-surface: *base_black
  mdc-theme-on-surface: *base_text
  mdc-theme-background: *base_black
  ha-dialog-surface-background: *base_black
  paper-dialog-background-color: *base_black
  mdc-ripple-hover-opacity: '0.1'
  mdc-ripple-color: *acc_charcoal

  # 7. Inputs & Text Fields (Transparent Lines)
  mdc-text-field-fill-color: *base_black
  mdc-text-field-ink-color: *base_icon
  mdc-text-field-label-ink-color: *base_subtext
  mdc-text-field-outline-color: *acc_graphite
  mdc-select-fill-color: *base_black
  mdc-select-ink-color: *base_icon
  mdc-select-outline-color: *acc_graphite
  input-idle-line-color: "transparent"
  mdc-select-idle-line-color: "transparent"
  mdc-text-field-idle-line-color: "transparent"

  # 8. Lists & Notifications
  paper-listbox-background-color: *base_black
  paper-listbox-color: *base_icon
  mdc-snackbar-container-color: *base_border
  mdc-snackbar-content-ink-color: *base_icon

  # 9. Global Card-Mod (Variable-linked Borders & Scrollbars)
  card-mod-card: |
    ha-card {
      background-color: *base_black !important;
      border: var(--ha-card-border-width) solid var(--ha-card-border-color) !important;
    }
    .card-header {
      background-color: *base_black !important;
      color: *base_icon !important;
      font-weight: var(--ha-font-weight-heading) !important;
    }
    :host {
      --scrollbar-thumb-color: *acc_charcoal !important;
      color-scheme: dark !important;
    }
    *::-webkit-scrollbar { width: 4px !important; }
    *::-webkit-scrollbar-thumb {
      background-color: *acc_charcoal !important;
      border-radius: 8px !important;
    }

  card-mod-more-info: |
    ha-card-picker $ ha-sub-page ha-icon-button-prev-next + h1 + div {
        background-color: *base_black !important;
    }
    ha-more-info-dialog $ ha-dialog {
        --mdc-dialog-heading-ink-color: *base_icon;
        --mdc-theme-on-surface: *base_icon;
    }

# ----------------------------------------------------------------
# THE FIVE INDIVIDUAL THEMES
# ----------------------------------------------------------------

# 1. MAIN CYAN
Black with Cyan:
  <<: *shared_config
  card-mod-theme: "Black Main"
  primary-color: *acc_cyan
  accent-color: *acc_cyan
  sidebar-selected-icon-color: *acc_cyan
  mdc-theme-primary: *acc_cyan
  paper-item-icon-active-color: *acc_cyan
  state-icon-color: *acc_cyan
  # History/Graph Sync
  ha-color-primary-50: *acc_cyan


