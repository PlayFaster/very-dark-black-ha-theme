# THEME METADATA
# Name: Very Dark Black HA Theme
# HA Support: 2025.1–2026.4+ (HSL scales require 2026+)
# Dependencies: card-mod (optional, for scrollbars & borders)
# Last Updated: 2026-07-04
# ----------------------------------------------------------------
# VERY DARK BLACK THEME
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# BASE THEME: SHARED LOGIC (Single anchor for all themes)
# ----------------------------------------------------------------

# NOTE: Do NOT add primary-color, state-active-color, card-mod-theme, or any key
# that individual color variants also define. This mapping IS the &base_logic anchor —
# any key added here is inherited by all color variants via merge (<<:). If a
# sub-theme also defines the same key, HA logs a duplicate key warning for every
# theme in the file. Keys that vary per variant belong in Section B.
Black with White: &base_logic # --- 1. Named Colors (Defined first for alias safety) ---
  red-color: &acc_red "#f44336"
  green-color: &acc_green "#4caf50"
  blue-color: &acc_blue "#2196f3"
  orange-color: &acc_orange "#ff9800"
  pink-color: &acc_pink "#ec4899"
  violet-color: &acc_violet "#7c3aed"
  purple-color: "#9c27b0"
  amber-color: "#ffc107"
  cyan-color: &acc_cyan "#00bcd4"
  teal-color: "#009688"
  emerald-color: &acc_emerald "#059669"
  fuchsia-color: "#ff00ff"
  indigo-color: &acc_indigo "#5c6bc0"
  silver-color: &acc_silver "#e0e0e0"

  # --- 1b. RGB Primitives (raw tuples for rgba() opacity variants) ---
  # Full set intentionally exposed as CSS custom properties for card-mod
  # user CSS: rgba(var(--token-rgb-cyan), 0.3). Only red and orange are
  # consumed internally (danger/warning fills). Do not prune the others
  # they may be used in future
  token-rgb-red: "244, 67, 54"
  token-rgb-green: "76, 175, 80"
  token-rgb-blue: "33, 150, 243"
  token-rgb-orange: "255, 152, 0"
  token-rgb-purple: "156, 39, 176"
  token-rgb-cyan: "0, 188, 212"
  token-rgb-fuchsia: "255, 0, 255"
  token-rgb-indigo: "92, 107, 192"
  token-rgb-silver: "224, 224, 224"
  token-rgb-violet: "124, 58, 237"
  token-rgb-pink: "236, 72, 153"
  token-rgb-emerald: "5, 150, 105"

  # --- 1c. Neutral Ramp (single source: keyed tokens = CSS vars + YAML anchors) ---
  # Every repeated neutral is defined ONCE here. Each key doubles as a CSS custom
  # property (--token-neutral-*) so card-mod (Section 20) can reference it via
  # var(), and carries a YAML anchor for parse-time reuse in the values below.
  # Legacy anchor names (base_black, acc_charcoal, …) are kept so all existing
  # *aliases keep resolving unchanged — only the DEFINITION site moved up here.
  # NOTE: token-neutral-white is deliberately SEPARATE from primary-text-color
  # (#e1e1e1). White = max-contrast emphasis (icons, input ink, dialog headings);
  # #e1e1e1 = body text. Do not merge them.
  token-neutral-white: &base_white "#ffffff"
  token-neutral-black: &base_black "#000000"
  token-neutral-deep: &base_deep "#050505"
  token-neutral-surface: &base_surface "#0a0a0a"
  token-neutral-hover: &base_hover "#151515"
  token-neutral-border: &base_border "#1a1a1a"
  token-neutral-line-strong: &acc_charcoal "#333333"
  token-neutral-line-medium: &acc_graphite "#444444"
  token-neutral-line-soft: &acc_medium "#666666"
  token-neutral-outline: &base_outline "#606060"

  # --- 2. Dashboard Base & Branding ---
  lovelace-background: *base_black
  primary-background-color: *base_black
  secondary-background-color: *base_surface
  app-header-background-color: *base_black
  app-header-text-color: *base_white
  sidebar-background-color: *base_black
  app-theme-color: *base_black

  # --- 3. Card Layout ---
  ha-card-border-width: "0.5px"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "none"
  # Granular Radius Scale
  token-size-radius-small: "8px"
  token-size-radius-medium: "12px"
  token-size-radius-large: "16px"

  # --- 4. Text, Icons & Typography ---
  primary-text-color: &base_text "#e1e1e1"
  secondary-text-color: &base_subtext "#a8a8a8" # Brightened for WCAG AA safety
  # Icons & Accents mapping to primary-color
  accent-color: "var(--primary-color, #e0e0e0)"
  paper-item-icon-color: "var(--primary-color, #aaaaaa)"
  state-icon-color: "var(--primary-color, #aaaaaa)"
  state-icon-active-color: "var(--primary-color, #aaaaaa)"
  # state-active-color is defined in individual themes to avoid YAML merge warnings
  sidebar-selected-icon-color: "var(--primary-color, #aaaaaa)"
  sidebar-selected-text-color: "var(--primary-color, #aaaaaa)"
  mdc-theme-primary: "var(--primary-color, #aaaaaa)"
  paper-item-icon-active-color: "var(--primary-color, #aaaaaa)"
  sl-color-primary-base: "var(--primary-color, #aaaaaa)"
  mdc-ripple-color: "var(--primary-color, #aaaaaa)"
  mdc-icon-button-ripple-opacity: "0.08"
  ha-font-weight-heading: "500"
  ha-font-weight-medium: "500"
  ha-font-weight-action: "500"
  title-font-weight: "500"
  ha-font-smoothing: "antialiased"

  # --- 4b. Optional Accent Emphasis ---
  # Theme philosophy: white/near-white text carries the body; the accent
  # (primary-color) pops on icons and active controls. The tokens below
  # extend that pop to EMPHASIS TEXT (titles/headers).
  #
  # Standard card titles — Entities/Glance/etc. .card-header (default: #ffffff).
  # Hook is live: the Section 20 card-mod uses var(--ha-card-header-color,#ffffff)
  # and paper-card-header-color mirrors it, so uncommenting this drives both the
  # modern and legacy header paths.
  # ha-card-header-color: var(--primary-color)
  #
  # Section card / heading-card TITLE (default: --primary-text-color #e1e1e1).
  # The heading-card ICON already pops accent (inherits state-icon-color).
  # ha-heading-card-title-color: var(--primary-color)
  #
  # Heading-card SUBTITLE line (default: --secondary-text-color #a8a8a8).
  # Intentionally active: subtitle line pops with accent color on accent themes.
  ha-heading-card-subtitle-color: var(--primary-color)
  #
  # Top toolbar / view title text (default below is #ffffff — replace value).
  # Note: this also tints header action icons. app-header-text-color is set in
  # Section 2; change it there rather than duplicating the key here.

  # --- 5. Sidebar & Navigation ---
  sidebar-icon-color: *base_subtext
  sidebar-text-color: *base_text

  # --- 6. Control States (Off/Unselected) ---
  paper-radio-button-unchecked-color: *acc_graphite
  paper-checkbox-unchecked-color: *acc_graphite
  control-item-icon-color: *base_white
  switch-unchecked-button-color: *acc_medium
  switch-unchecked-track-color: *acc_charcoal
  mdc-switch-unselected-icon-color: *base_white
  mdc-switch-unselected-track-color: *acc_charcoal
  mdc-switch-unselected-handle-color: *acc_medium

  # --- 7. System UI (Menus/Dialogs/Selections) ---
  outline-color: *acc_charcoal
  dialog-box-shadow: "none"
  mdc-theme-on-surface: *base_text
  mdc-theme-background: *base_black
  mdc-list-item-hover-leading-icon-color: *base_white
  # Data Table Styling
  data-table-background-color: *base_black
  mdc-data-table-header-cell-font-weight: "600"

  # --- 8. Inputs & Text Fields ---
  mdc-text-field-fill-color: *base_black
  mdc-text-field-ink-color: *base_white
  mdc-text-field-label-ink-color: *base_subtext
  mdc-select-fill-color: *base_black
  mdc-select-ink-color: *base_white
  ha-select-fill-color: *base_black
  ha-textfield-fill-color: *base_black
  input-fill-color: *base_black
  md-sys-color-surface-container-highest: *base_black
  md-sys-color-surface-container: *base_black
  sl-input-filled-background-color: *base_black
  sl-input-background-color: *base_black
  ha-filled-text-field-fill-color: *base_black
  ha-filled-select-fill-color: *base_black
  md-sys-color-surface-container-high: *base_black
  md-sys-color-surface-variant: *base_black
  md-sys-color-surface-container-low: *base_black
  md-sys-color-surface-container-lowest: *base_black
  ha-color-form-background: *base_black
  ha-color-form-background-hover: *base_surface
  ha-color-form-background-disabled: "var(--ha-color-fill-disabled-normal-resting)"
  input-label-ink-color: *base_white
  input-idle-line-color: "transparent"
  mdc-select-idle-line-color: "transparent"
  mdc-text-field-idle-line-color: "transparent"
  wa-text-field-fill-background-color: *base_black
  wa-select-fill-background-color: *base_black
  ha-textfield-border-radius: var(--token-size-radius-small)
  ha-select-border-radius: var(--token-size-radius-small)

  # --- 9. Lists & Notifications ---
  paper-listbox-background-color: *base_black
  paper-listbox-color: *base_white
  mdc-snackbar-container-color: *base_border
  mdc-snackbar-content-ink-color: *base_white

  # --- 10. Mode Handling ---
  theme-base: dark
  modes:
    dark: {}
    light: {}

  # --- 11. Modern Semantic Tokens ---
  # 2026+ Material 3 Semantic Tokens
  ha-color-fill-neutral-quiet-resting: *base_black
  ha-color-fill-neutral-quiet-hover: *base_surface
  ha-color-fill-neutral-quiet-active: *base_black
  ha-color-fill-neutral-normal-resting: *base_surface
  ha-color-fill-neutral-normal-hover: *base_hover
  ha-color-fill-neutral-normal-active: *base_surface
  md-sys-color-on-surface-variant: var(--secondary-text-color)
  md-sys-color-outline-variant: *acc_graphite
  md-sys-color-error: *acc_red
  md-sys-color-on-error: *base_white
  md-sys-color-warning: *acc_orange
  md-sys-color-success: *acc_green
  md-sys-color-info: *acc_blue

  # --- 12. Global Color Scales (Neutral & Primary) ---
  # NOTE: hsl(from ...) syntax requires HA 2026.4+ / Modern Browser
  ha-color-neutral-05: hsl(from var(--secondary-text-color) h s calc(l * 0.15))
  ha-color-neutral-10: hsl(from var(--secondary-text-color) h s calc(l * 0.25))
  ha-color-neutral-20: hsl(from var(--secondary-text-color) h s calc(l * 0.40))
  ha-color-neutral-30: hsl(from var(--secondary-text-color) h s calc(l * 0.70))
  ha-color-neutral-40: var(--secondary-text-color)
  ha-color-neutral-50: hsl(from var(--secondary-text-color) h s calc(l * 1.15))
  ha-color-neutral-60: hsl(from var(--secondary-text-color) h s calc(l * 1.30))
  ha-color-neutral-70: hsl(from var(--secondary-text-color) h s calc(l * 1.45))
  ha-color-neutral-80: hsl(from var(--secondary-text-color) h s calc(l * 1.60))
  ha-color-neutral-90: hsl(from var(--secondary-text-color) h s calc(l * 1.75))
  ha-color-neutral-95: hsl(from var(--secondary-text-color) h s calc(l * 1.90))
  ha-color-primary-05: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 0.15))"
  ha-color-primary-10: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 0.25))"
  ha-color-primary-20: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 0.40))"
  ha-color-primary-30: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 0.70))"
  ha-color-primary-40: "var(--primary-color, #aaaaaa)"
  ha-color-primary-50: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.15))"
  ha-color-primary-60: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.30))"
  ha-color-primary-70: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.45))"
  ha-color-primary-80: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.60))"
  ha-color-primary-90: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.75))"
  ha-color-primary-95: "hsl(from var(--primary-color, #aaaaaa) h s calc(l * 1.90))"

  # --- 13. Energy & Graphs ---
  energy-grid-consumption-color: *acc_blue
  energy-grid-return-color: *acc_violet
  energy-solar-color: *acc_orange
  energy-non-fossil-color: *acc_green
  energy-battery-out-color: *acc_cyan
  energy-battery-in-color: *acc_violet
  energy-gas-color: *acc_red
  energy-water-color: *acc_cyan
  graph-color-1: var(--primary-color)
  graph-color-2: *acc_blue
  graph-color-3: *acc_green
  graph-color-4: *acc_violet
  graph-color-5: *acc_red
  graph-color-6: *acc_cyan
  graph-color-7: "#009688"
  graph-color-8: "#e91e63"
  graph-color-9: "#ff5722"
  graph-color-10: "#3f51b5"

  # --- 13b. Lock States ---
  # HA defaults these to fixed green/red hues that clash with the monochrome
  # accent scheme. Mapped to the theme's own active/inactive/danger pattern:
  # locked = accent (active, like switch-on), transitional/unlocked = muted
  # grey (inactive), jammed = red (a genuine fault that warrants breaking
  # monochrome). Flip locked/unlocked here if you prefer unlocked to alert.
  state-lock-locked-color: var(--primary-color)
  state-lock-unlocked-color: var(--secondary-text-color)
  state-lock-locking-color: var(--secondary-text-color)
  state-lock-unlocking-color: var(--secondary-text-color)
  state-lock-open-color: var(--secondary-text-color)
  state-lock-jammed-color: *acc_red

  # --- 14. Disabled Fills ---
  ha-color-fill-disabled-normal-resting: "rgba(155, 155, 155, 0.08)"
  ha-color-on-disabled-normal: "rgba(155, 155, 155, 0.5)"
  # Legacy token — still drives disabled labels in older component paths that
  # predate ha-color-on-disabled-normal. Kept literal (not aliased) for safety.
  disabled-text-color: "rgba(155, 155, 155, 0.5)"

  # --- 15. Danger/Warning Tag Fills ---
  # Dark theme: low-opacity fills give a subtle tint on pure black;
  # on-color references the semantic error/warning tokens to preserve HA's
  # default red/orange. A light variant would need the same low-opacity fills
  # but with a dark on-color.
  ha-color-fill-danger-normal-resting: "rgba(var(--token-rgb-red), 0.15)"
  ha-color-fill-danger-normal-hover: "rgba(var(--token-rgb-red), 0.22)"
  ha-color-fill-danger-normal-active: "rgba(var(--token-rgb-red), 0.28)"
  ha-color-on-danger-normal: "var(--md-sys-color-error)"
  ha-color-fill-warning-normal-resting: "rgba(var(--token-rgb-orange), 0.15)"
  ha-color-fill-warning-normal-hover: "rgba(var(--token-rgb-orange), 0.22)"
  ha-color-fill-warning-normal-active: "rgba(var(--token-rgb-orange), 0.28)"
  ha-color-on-warning-normal: "var(--md-sys-color-warning)"

  # --- 16. 2026.5 Web Awesome Components & Global Updates ---
  # Box Shadows
  ha-box-shadow-s: "none"
  ha-box-shadow-m: "none"
  ha-box-shadow-l: "none"

  # Surface Colors (Tooltips & Popovers)
  ha-color-surface-default: *base_surface
  ha-color-surface-low: *base_deep
  ha-color-surface-lower: *base_black
  ha-color-surface-default-inverted: *base_white
  ha-color-surface-low-inverted: "#f5f5f5"
  ha-color-surface-lower-inverted: "#e0e0e0"
  ha-tooltip-background-color: "var(--secondary-background-color)"
  ha-tooltip-text-color: "var(--primary-text-color)"

  # Progress Bar Customization
  ha-progress-bar-indicator-color: "var(--primary-color, #aaaaaa)"
  ha-progress-bar-indicator-background: "var(--primary-color, #aaaaaa)"
  ha-progress-bar-track-color: *base_border
  ha-progress-bar-track-height: "4px"
  ha-progress-bar-border-radius: "4px"

  # Web Awesome Switch - Unchecked
  ha-switch-background-color: "#1e1e1e"
  ha-switch-thumb-background-color: *acc_medium
  ha-switch-background-color-hover: "#2a2a2a"
  ha-switch-thumb-background-color-hover: "#888888"
  ha-switch-border-color: *acc_charcoal
  ha-switch-thumb-border-color: *acc_medium

  # Web Awesome Switch - Checked
  ha-switch-checked-background-color: "var(--ha-color-primary-10)"
  ha-switch-checked-thumb-background-color: "var(--primary-color, #aaaaaa)"
  ha-switch-checked-background-color-hover: "var(--ha-color-primary-20)"
  ha-switch-checked-thumb-background-color-hover: "var(--primary-color, #aaaaaa)"
  ha-switch-checked-border-color: "var(--primary-color, #aaaaaa)"
  ha-switch-checked-thumb-border-color: "var(--primary-color, #aaaaaa)"
  ha-switch-checked-thumb-border-color-hover: "var(--primary-color, #aaaaaa)"
  # ha-control-switch fallback for legacy/standalone control paths (tile cards override inline)
  control-switch-on-color: "var(--primary-color, #aaaaaa)"

  # Entity Toggle Size Overrides (PR #51984)
  ha-entity-toggle-switch-width: "38px"
  ha-entity-toggle-switch-size: "20px"
  ha-entity-toggle-switch-thumb-size: "14px"

  # HA Control Slider (ha-slider)
  ha-slider-thumb-color: "var(--primary-color, #aaaaaa)"
  ha-slider-indicator-color: "var(--primary-color, #aaaaaa)"

  # Web Awesome Checkbox
  ha-checkbox-size: "18px"
  ha-checkbox-border-width: "1.5px"
  ha-checkbox-border-radius: "4px"
  ha-checkbox-border-color: *acc_graphite
  ha-checkbox-border-color-hover: *acc_medium
  ha-checkbox-background-color: "transparent"
  ha-checkbox-background-color-hover: *base_hover
  ha-checkbox-checked-background-color: "var(--primary-color, #aaaaaa)"
  ha-checkbox-checked-background-color-hover: "var(--primary-color, #aaaaaa)"
  ha-checkbox-checked-icon-color: *base_white

  # --- 17. 2026.6 Web Awesome Radio ---
  ha-radio-option-active-color: "var(--primary-color, #aaaaaa)"
  ha-radio-option-border-color: *acc_graphite
  ha-radio-option-border-color-hover: *acc_medium
  ha-radio-option-border-width: "1.5px"
  ha-radio-option-background-color: "transparent"
  ha-radio-option-background-color-hover: *base_hover
  ha-radio-option-checked-background-color: "var(--primary-color, #aaaaaa)"
  ha-radio-option-checked-icon-color: *base_white

  # --- 18. Forum Discovered Elements & Compatibility Patches ---
  # Dropdown Inputs & Outlined Inputs
  mdc-select-label-ink-color: "var(--secondary-text-color)"
  input-outlined-idle-border-color: *acc_graphite
  input-outlined-hover-border-color: "var(--primary-color, #aaaaaa)"
  input-outlined-disabled-border-color: "transparent"

  # Markdown Inline Code Styling
  markdown-code-background-color: "var(--secondary-background-color)"
  # Pairs with the background above — without this, inline-code text falls back
  # to a default that risks low contrast on the #0a0a0a code fill.
  markdown-code-text-color: "var(--primary-text-color)"

  # Web Awesome Input Shims
  ha-color-ink-color: *base_white
  ha-color-fill-color: *base_black
  ha-color-disabled-fill-color: "transparent"
  ha-color-label-ink-color: "var(--secondary-text-color)"
  ha-color-disabled-ink-color: "rgba(155, 155, 155, 0.5)"
  ha-color-dropdown-icon-color: *base_white
  ha-color-idle-line-color: "transparent"
  ha-color-hover-line-color: "transparent"

  # Primary-scale Dynamic Tokens (Quiet & Normal States)
  ha-color-fill-primary-quiet-resting: "var(--ha-color-primary-05)"
  ha-color-fill-primary-quiet-hover: "var(--ha-color-primary-10)"
  ha-color-fill-primary-quiet-active: "var(--ha-color-primary-20)"
  ha-color-fill-primary-normal-resting: "var(--ha-color-primary-10)"
  ha-color-fill-primary-normal-hover: "var(--ha-color-primary-20)"
  ha-color-fill-primary-normal-active: "var(--ha-color-primary-30)"

  # Badges Customization (Contrast-safe overrides for white text)
  label-badge-background-color: *base_black
  label-badge-text-color: *base_white
  label-badge-red: "#ae1332"
  label-badge-green: "#1a703e"
  label-badge-blue: "#0a687f"
  label-badge-yellow: "#796206"
  label-badge-grey: "#535a67"

  # Legacy & Paper Components Fallback
  paper-card-background-color: *base_black
  paper-card-header-color: "var(--ha-card-header-color, #ffffff)"
  paper-toggle-button-checked-bar-color: "var(--primary-color)"
  paper-toggle-button-checked-button-color: "var(--primary-color)"
  paper-toggle-button-checked-ink-color: "var(--primary-color)"
  paper-progress-secondary-color: "var(--primary-color)"
  paper-slider-active-color: "var(--primary-color)"
  paper-slider-container-color: "var(--secondary-background-color)"
  paper-slider-knob-color: "var(--primary-color)"
  paper-slider-knob-start-color: "var(--primary-color)"
  paper-slider-pin-color: "var(--primary-color)"
  paper-slider-secondary-color: "var(--primary-color)"

  # Data Tables
  table-row-background-color: *base_black
  table-row-alternative-background-color: *base_surface

  # --- 19. Card Surfaces & Dialogs ---
  ha-card-background: *base_black
  card-background-color: *base_black
  ha-card-border-color: "rgba(255, 255, 255, 0.12)"
  divider-color: "#222222"
  # CodeMirror surface (YAML/automation/template editors) — does not follow
  # card backgrounds natively, leaving a lighter panel on pure black.
  code-editor-background-color: *base_black
  mdc-dialog-scrim-color: "rgba(0,0,0,0.9)"
  ha-dialog-surface-background: *base_black
  paper-dialog-background-color: *base_black
  mdc-theme-surface: *base_black
  wa-color-surface-raised: *base_surface
  mdc-ripple-hover-opacity: "0.12"
  mdc-list-item-selected-container-color: "rgba(255, 255, 255, 0.1)"
  mdc-text-field-outline-color: *base_outline
  mdc-select-outline-color: *base_outline
  ha-color-form-outline: *base_outline
  ha-color-form-outline-hover: "var(--primary-color, #aaaaaa)"
  input-dropdown-icon-color: *base_white

  # --- 20. Global Card-Mod ---
  card-mod-card: |
    ha-card {
      background-color: var(--ha-card-background, #000000) !important;
      border-width: var(--ha-card-border-width) !important;
      border-style: solid !important;
      border-color: var(--ha-card-border-color) !important;
    }
    /* Component Exclusions for Transparent Cards */
    :host(hui-heading-card) ha-card,
    /* intentional: frameless float on pure black — revisit if borders needed */
    :host(hui-glance-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(.type-custom-bubble-card) ha-card,
    :host(mushroom-chips-card) ha-card,
    :host(hui-conditional-card) ha-card,
    :host(custom-button-card) ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .card-header {
      background-color: var(--ha-card-background, #000000) !important;
      /* var-with-fallback keeps the white default but lets the optional
         ha-card-header-color accent hook (see Section 4b) actually win */
      color: var(--ha-card-header-color, #ffffff) !important;
      font-weight: var(--ha-font-weight-heading) !important;
    }
    :host {
      --scrollbar-thumb-color: var(--token-neutral-line-strong, #333333) !important;
      color-scheme: dark !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
    }
    *::-webkit-scrollbar { width: 4px !important; }
    *::-webkit-scrollbar-thumb {
      background-color: var(--token-neutral-line-strong, #333333) !important;
      border-radius: 8px !important;
    }
    /* Subtle Inset Shadow for Inputs */
    ha-textfield, ha-select, input {
      --ha-textfield-box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
      --ha-select-box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.05) !important;
    }
    /* Data Table & List Refinements */
    .mdc-data-table__header-cell {
      background-color: var(--token-neutral-deep, #050505) !important;
      border-bottom: 1px solid var(--divider-color) !important;
    }
    .mdc-data-table__row:hover {
      background-color: rgba(255, 255, 255, 0.02) !important;
    }
  card-mod-more-info: |
    /* ha-card-picker selector removed 2026-05-01. Was patching a black background
       gap in the card picker sub-page via brittle adjacent-sibling selectors
       (+h1+div). Neither Frosted Glass nor Graphite require this — native tokens
       (mdc-theme-surface, ha-dialog-surface-background) should cover it. If a
       light background reappears in the card picker, replace with:
         ha-card-picker $ ha-sub-page { background-color: #000000; } */
    /* Intentional override: sets heading and on-surface text to pure white
       (#ffffff) inside more-info dialogs, overriding the global native token
       mdc-theme-on-surface: #e1e1e1. Pure-black backgrounds need this extra
       contrast that non-black reference themes (Frosted Glass, Graphite) do
       not require. Not present in either reference theme — added to fix a
       black-specific visibility issue. Remove and test if native token coverage
       improves in future HA versions. */
    ha-more-info-dialog $ ha-dialog,
    ha-more-info-dialog $ wa-dialog {
        --mdc-dialog-heading-ink-color: var(--token-neutral-white, #ffffff);
        --mdc-theme-on-surface: var(--token-neutral-white, #ffffff);
    }

