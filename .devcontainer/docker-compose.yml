---
services:
  homeassistant:
    container_name: very-dark-black-ha-dev
    # Use the local master image
    image: ha-dev-base:latest
    volumes:
      # Mount the whole project so the DevContainer workspace works
      - ..:/workspaces/very-dark-black-ha-theme
      # Mount your local dev config
      - ./.devconfig:/config
      # Maps your theme file into the HA themes folder
      - ../themes:/config/themes:ro
      # Project notes and shared files
      - C:/Local/Code/github/PlayFaster/home-assistant/shared/ProjNotes/Notes-very-dark-black-ha-theme:/workspaces/very-dark-black-ha-theme/.notes
      - C:/Local/Code/github/PlayFaster/home-assistant/shared/SharedNotes:/workspaces/very-dark-black-ha-theme/.shared
      # HA core source — read-only, used by mypy for type resolution
      - C:/Local/Code/ha_core/core:/ha_core:ro
      # Docker Outside Docker (DooD) — allows running docker commands from inside
      # the container by delegating to the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8123:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/London
