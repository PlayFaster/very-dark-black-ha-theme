              ## Heading 2
              ### Heading 3
              #### Heading 4

              Normal paragraph text. **Bold text.** *Italic text.* `inline code`.

              > Blockquote text — should look distinct from body copy.

              ---

              Unordered list:
              - Item one
              - Item two
              - Item three

              Ordered list:
              1. First item
              2. Second item
              3. Third item

              | Column A | Column B | Column C |
              |----------|----------|----------|
              | Value 1  | Value 2  | Value 3  |
              | Value 4  | Value 5  | Value 6  |

              ```yaml
              # Fenced code block — markdown-code-background-color token
              sensor:
                - name: Example
                  state: "{{ states('input_number.mock_volume_level') }}"
              ```

              Link: [Home Assistant](https://www.home-assistant.io)

  # ══════════════════════════════════════════════════════════════════════════
  # VIEW 3 — Theme Test (original masonry view — full comprehensive layout)
  # Kept as-is: exercises masonry column reflow, all card types in sequence.
  # ══════════════════════════════════════════════════════════════════════════
  - title: Theme Test
    icon: mdi:palette
    type: masonry

    # ── View-level badges ────────────────────────────────────────────────
    # Tests label-badge-* tokens and chip/badge component styling.
    # Badge colour is driven by entity domain + state.
    badges:
      - type: entity
        entity: binary_sensor.internet_connectivity
        show_name: true
        name: Internet
      - type: entity
        entity: alarm_control_panel.home_alarm
        show_name: true
        name: Alarm
      - type: entity
        entity: sensor.kitchen_temperature
        show_name: true
        name: Kitchen
      - type: entity
        entity: sensor.e_ink_display_battery_level
        show_name: true
        name: Battery
      - type: entity
        entity: binary_sensor.night
        show_name: true
        name: Night
      - type: entity
        entity: binary_sensor.mock_problem_alert
        show_name: true
        name: Problem
      - type: entity
        entity: switch.smart_plug_tv
        show_name: true
        name: TV

    cards:
      # ─────────────────────────────────────────────────────────────────────
      - type: markdown
        content: >
          ## Very Dark Black — Theme Test Dashboard

          All major HA UI element types and states in one place. Use **Developer Tools →
          YAML → Reload Lovelace** to refresh after theme changes. Each section is
          labelled with what it exercises.

      # ════════════════════════════════════════════════════════════════════
      # MORE INFO DIALOG NOTE
      # ════════════════════════════════════════════════════════════════════
      - type: markdown
        title: "More Info Dialog — card-mod-more-info"
        content: >
          **Tap any entity** to open its More Info dialog and test: heading ink color
          (`#ffffff` override), dialog surface background (pure black), scrim/backdrop
          (`rgba(0,0,0,0.9)`), on-surface text contrast, form controls inside dialogs
          (input backgrounds, selects, sliders), and the number / cover / climate /
          alarm detail views.

      # ════════════════════════════════════════════════════════════════════
      # HEADING CARD — title / subtitle / badges
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Heading Card — title style with entity badges
        heading_style: title
        icon: mdi:card-text-outline
        badges:
          - type: entity
            entity: binary_sensor.internet_connectivity
            name: Connectivity
          - type: entity
            entity: sensor.kitchen_temperature
            name: Kitchen
          - type: entity
            entity: sensor.e_ink_display_battery_level
            name: Battery

      - type: heading
        heading: Subtitle style heading (no badges)
        heading_style: subtitle

      # ════════════════════════════════════════════════════════════════════
      # TILE CARDS
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Tile Cards
        heading_style: title
        icon: mdi:view-grid

      - type: heading
        heading: Active / togglable states
        heading_style: subtitle

      - type: horizontal-stack
        cards:
          - type: tile
            entity: switch.smart_plug_tv
            name: Switch
          - type: tile
            entity: light.led_strip
            name: Light
          - type: tile
            entity: fan.ceiling_fan
            name: Fan

      - type: horizontal-stack
        cards:
          - type: tile
            entity: lock.front_door_lock
            name: Lock
          - type: tile
            entity: cover.garage_door
            name: Cover
          - type: tile
            entity: binary_sensor.internet_connectivity
            name: Binary On

      - type: heading
        heading: Sensor / read-only states
        heading_style: subtitle

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.kitchen_temperature
            name: Temperature
          - type: tile
            entity: sensor.kitchen_humidity
            name: Humidity
          - type: tile
            entity: sensor.e_ink_display_battery_level
            name: Battery %

      - type: horizontal-stack
        cards:
          - type: tile
            entity: binary_sensor.office_window_contact
            name: Binary Off
          - type: tile
            entity: binary_sensor.fireplace_too_hot
            name: Binary Alert
          - type: tile
            entity: sensor.unavailable_sensor
            name: Unavailable

      - type: heading
        heading: Switch on vs off — primary-color vs unchecked-color
        heading_style: subtitle

      - type: horizontal-stack
        cards:
          - type: tile
            entity: switch.smart_plug_tv
            name: SW — on state
          - type: tile
            entity: switch.smart_plug_office_ac
            name: SW — off state
          - type: tile
            entity: light.led_strip
            name: Light — on
          - type: tile
            entity: light.star_projector
            name: Light — off

      # ════════════════════════════════════════════════════════════════════
      # DANGER / WARNING STATE FILLS (Section 15)
      # ha-color-fill-danger-* and ha-color-fill-warning-*
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Danger / Warning State Fills
        heading_style: title
        icon: mdi:alert

      - type: horizontal-stack
        cards:
          - type: tile
            entity: binary_sensor.mock_problem_alert
            name: Problem — danger
          - type: tile
            entity: binary_sensor.mock_heat_alert
            name: Heat Alert — warning
          - type: tile
            entity: binary_sensor.fireplace_too_hot
            name: Heat — inactive

      - type: entities
        title: Alert Entity Rows (hover to see fill states)
        entities:
          - entity: binary_sensor.mock_problem_alert
            name: Problem alert — danger fill
          - entity: binary_sensor.mock_heat_alert
            name: Heat alert — warning fill
          - entity: binary_sensor.fireplace_too_hot
            name: Heat sensor — inactive (no fill)

      # ════════════════════════════════════════════════════════════════════
      # ENTITY ROWS — Switches & Lights
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Entity Card — Switches & Lights
        heading_style: title
        icon: mdi:toggle-switch

      - type: entities
        title: Switches
        show_header_toggle: true
        entities:
          - switch.smart_plug_tv
          - switch.smart_plug_office_ac
          - switch.smart_plug_coffee_machine
          - switch.smart_plug_lava_lamp
          - switch.smart_plug_kitchen_heater
          - switch.smart_plug_office_heater

      - type: entities
        title: Lights
        show_header_toggle: true
        entities:
          - light.led_strip
          - light.star_projector

      # ════════════════════════════════════════════════════════════════════
      # ENTITY ROWS — Input Controls (sliders, selects, booleans, datetime)
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Entity Card — Input Controls
        heading_style: title
        icon: mdi:tune

      - type: entities
        title: Number Sliders
        entities:
          - entity: input_number.mock_brightness_level
            name: Brightness Level
          - entity: input_number.mock_volume_level
            name: Volume Level
          - entity: input_number.mock_fan_speed
            name: Fan Speed
          - entity: input_number.mock_target_humidity
            name: Target Humidity
          - entity: input_number.mock_mp_volume
            name: Media Volume

      - type: entities
        title: Select Dropdowns
        entities:
          - entity: input_select.mock_hvac_mode
            name: HVAC Mode (input)
          - entity: input_select.mock_mp_source
            name: Media Source (input)
          - entity: select.hvac_mode
            name: HVAC Mode (template)

      - type: entities
        title: Booleans (checkbox rows)
        entities:
          - entity: input_boolean.auto_light_kitchen
            name: Auto Light Kitchen
          - entity: input_boolean.manual_fire_place
            name: Manual Fireplace

      - type: entities
        title: Date & Time Inputs
        entities:
          - entity: input_datetime.morning_alarm
            name: Morning Alarm
          - entity: input_datetime.vacation_start
            name: Vacation Start

      # ════════════════════════════════════════════════════════════════════
      # TEXT INPUT FIELDS
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Text Input Fields
        heading_style: title
        icon: mdi:form-textbox

      - type: entities
        title: input_text — normal state (form-background)
        entities:
          - entity: input_text.mock_text_note
            name: Short Note (max 50)
          - entity: input_text.mock_text_message
            name: Long Message (max 255)
          - entity: input_text.mock_text_password
            name: Password Field (masked)

      # ════════════════════════════════════════════════════════════════════
      # DISABLED FORM CONTROLS
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Disabled Form Controls (form-background-disabled)
        heading_style: title
        icon: mdi:form-textbox-lock

      - type: entities
        title: Normal vs disabled — grey-wash comparison
        entities:
          - type: section
            label: Normal (for comparison)
          - entity: number.ceiling_fan_speed
            name: Number — normal
          - entity: select.hvac_mode
            name: Select — normal
          - type: section
            label: Unavailable / disabled
          - entity: number.unavailable_number
            name: Number — unavailable
          - entity: select.unavailable_select
            name: Select — unavailable

      # ════════════════════════════════════════════════════════════════════
      # ENTITY ROWS — Covers & Locks
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Entity Card — Covers & Locks
        heading_style: title
        icon: mdi:door-closed

      - type: entities
        title: Covers
        entities:
          - cover.garage_door
          - cover.living_room_blinds
          - cover.bedroom_curtains

      - type: entities
        title: Locks
        entities:
          - lock.front_door_lock
          - lock.back_door_lock

      # ════════════════════════════════════════════════════════════════════
      # ENTITY ROWS — Sensors & Binary Sensors
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Entity Card — Sensors
        heading_style: title
        icon: mdi:thermometer

      - type: entities
        title: Environment
        entities:
          - type: section
            label: Temperature
          - sensor.kitchen_temperature
          - sensor.bedroom_temperature
          - sensor.bathroom_temperature
          - sensor.office_temperature
          - sensor.outdoor_temperature
          - type: section
            label: Air Quality
          - sensor.kitchen_humidity
          - sensor.kitchen_air_quality_pm25
          - sensor.office_carbon_dioxide
          - sensor.office_humidity
          - type: section
            label: Power
          - sensor.office_workbench_power
          - sensor.living_room_outlet_power
          - sensor.grid_frequency

      - type: entities
        title: Binary Sensors
        entities:
          - binary_sensor.internet_connectivity
          - binary_sensor.router_connectivity
          - binary_sensor.office_weather_station_connectivity
          - type: divider
          - entity: binary_sensor.office_window_contact
            name: Office Window
          - entity: binary_sensor.kitchen_window_contact
            name: Kitchen Window
          - entity: binary_sensor.bathroom_door_contact
            name: Bathroom Door
          - binary_sensor.fireplace_too_hot
          - binary_sensor.night

      # ════════════════════════════════════════════════════════════════════
      # GLANCE CARD
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Glance Card
        heading_style: title
        icon: mdi:view-compact

      - type: glance
        title: Room Temperatures
        show_state: true
        columns: 6
        entities:
          - entity: sensor.kitchen_temperature
            name: Kitchen
          - entity: sensor.bedroom_temperature
            name: Bedroom
          - entity: sensor.bathroom_temperature
            name: Bathroom
          - entity: sensor.office_temperature
            name: Office
          - entity: sensor.living_room_temperature
            name: Living Rm
          - entity: sensor.outdoor_temperature
            name: Outdoor

      - type: glance
        title: Device States (icons + on/off colour)
        show_state: true
        columns: 6
        entities:
          - switch.smart_plug_tv
          - light.led_strip
          - fan.ceiling_fan
          - binary_sensor.internet_connectivity
          - lock.front_door_lock
          - cover.garage_door

      # ════════════════════════════════════════════════════════════════════
      # BUTTON CARDS
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Button Cards
        heading_style: title
        icon: mdi:gesture-tap-button

      - type: horizontal-stack
        cards:
          - type: button
            entity: button.restart_router
            name: Template Button
            icon: mdi:router-wireless
            tap_action:
              action: toggle
          - type: button
            entity: input_button.wood_added
            name: Input Button
            icon: mdi:fire
            tap_action:
              action: toggle
          - type: button
            entity: switch.smart_plug_tv
            name: Switch Toggle
            icon: mdi:television
            tap_action:
              action: toggle
          - type: button
            entity: light.led_strip
            name: Light Toggle
            icon: mdi:led-strip
            show_state: true
            tap_action:
              action: toggle

      - type: entities
        title: Button Rows
        entities:
          - entity: button.restart_router
            name: Template Button Row
          - entity: input_button.wood_added
            name: Input Button Row
          - type: button
            name: Service Call Row
            action_name: Trigger
            icon: mdi:bell
            tap_action:
              action: call-service
              service: system_log.write
              data:
                message: Theme test button pressed
                level: info

      # ════════════════════════════════════════════════════════════════════
      # GAUGE CARDS
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Gauge Cards (severity colours)
        heading_style: title
        icon: mdi:gauge

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.kitchen_humidity
            name: Humidity %
            unit: "%"
            min: 0
            max: 100
            needle: false
            severity:
              green: 40
              yellow: 70
              red: 85
          - type: gauge
            entity: sensor.e_ink_display_battery_level
            name: Battery %
            unit: "%"
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 40
              green: 60
          - type: gauge
            entity: sensor.office_carbon_dioxide
            name: CO₂ ppm
            min: 400
            max: 2000
            needle: true
            severity:
              green: 400
              yellow: 1000
              red: 1500

      # ════════════════════════════════════════════════════════════════════
      # SENSOR CARD — single entity with inline sparkline
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Sensor Card (single entity + sparkline)
        heading_style: title
        icon: mdi:chart-areaspline

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.kitchen_temperature
            name: Kitchen Temp
            graph: line
            hours_to_show: 24
          - type: sensor
            entity: sensor.office_carbon_dioxide
            name: Office CO₂
            graph: line
            hours_to_show: 24
          - type: sensor
            entity: sensor.e_ink_display_battery_level
            name: Battery
            graph: line
            hours_to_show: 24

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.office_workbench_power
            name: Workbench Power
            graph: line
            hours_to_show: 24
          - type: sensor
            entity: sensor.kitchen_humidity
            name: Humidity
            graph: line
            hours_to_show: 24
          - type: sensor
            entity: sensor.outdoor_temperature
            name: Outdoor Temp
            graph: line
            hours_to_show: 24

      # ════════════════════════════════════════════════════════════════════
      # HISTORY GRAPH — 4 entities
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: History Graph (line colours, legend)
        heading_style: title
        icon: mdi:chart-line

      - type: history-graph
        title: Temperature — 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.kitchen_temperature
            name: Kitchen
          - entity: sensor.bedroom_temperature
            name: Bedroom
          - entity: sensor.office_temperature
            name: Office
          - entity: sensor.outdoor_temperature
            name: Outdoor

      # ════════════════════════════════════════════════════════════════════
      # HISTORY GRAPH — all 10 graph-color-* tokens
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Graph Colours — all 10 tokens (graph-color-1 → 10)
        heading_style: title
        icon: mdi:palette

      - type: history-graph
        title: graph-color-1 (primary) → graph-color-10 (indigo)
        hours_to_show: 24
        entities:
          - entity: sensor.kitchen_temperature
            name: "1 — primary"
          - entity: sensor.bedroom_temperature
            name: "2 — blue"
          - entity: sensor.bathroom_temperature
            name: "3 — green"
          - entity: sensor.office_temperature
            name: "4 — violet"
          - entity: sensor.outdoor_temperature
            name: "5 — red"
          - entity: sensor.fireplace_temperature
            name: "6 — cyan"
          - entity: sensor.storage_room_temperature
            name: "7 — teal"
          - entity: sensor.living_room_temperature
            name: "8 — pink"
          - entity: sensor.outdoor_station_temperature
            name: "9 — deep-orange"
          - entity: sensor.outdoor_station_humidity
            name: "10 — indigo"

      # ════════════════════════════════════════════════════════════════════
      # STATISTICS GRAPH
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Statistics Graph (bar/area chart variant)
        heading_style: title
        icon: mdi:chart-bar

      - type: statistics-graph
        title: Temperature Stats — 7 days
        period: day
        days_to_show: 7
        chart_type: line
        entities:
          - entity: sensor.kitchen_temperature
            name: Kitchen
          - entity: sensor.office_temperature
            name: Office
          - entity: sensor.outdoor_temperature
            name: Outdoor

      - type: statistics-graph
        title: Power Consumption — 7 days (bar)
        period: day
        days_to_show: 7
        chart_type: bar
        stat_types:
          - mean
        entities:
          - entity: sensor.office_workbench_power
            name: Workbench
          - entity: sensor.living_room_outlet_power
            name: Living Room

      # ════════════════════════════════════════════════════════════════════
      # WEATHER — all 15 condition icons selectable live
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Weather Card (15 conditions — use selector to cycle)
        heading_style: title
        icon: mdi:weather-partly-cloudy

      - type: entities
        title: Condition Selector
        entities:
          - entity: input_select.mock_weather_condition
            name: Weather Condition (changes icon + card)

      - type: weather-forecast
        show_current: true
        show_forecast: false
        entity: weather.mock_weather
        round_temperature: false

      - type: horizontal-stack
        cards:
          - type: tile
            entity: weather.mock_weather
            name: Weather Tile
          - type: glance
            show_state: true
            entities:
              - entity: weather.mock_weather
                name: Glance

      # ════════════════════════════════════════════════════════════════════
      # THERMOSTAT / CLIMATE
      # ════════════════════════════════════════════════════════════════════
      - type: heading
        heading: Thermostat Card (climate controls)
        heading_style: title
        icon: mdi:thermostat

      - type: horizontal-stack
        cards:
          - type: thermostat
            entity: climate.kitchen_climate_control
            name: Kitchen
          - type: thermostat
            entity: climate.office_climate_control
            name: Office

      - type: entities
        title: Climate Entity Rows
        entities:
          - climate.kitchen_climate_control
          - climate.fireplace
          - climate.office_climate_control

      # ════════════════════════════════════════════════════════════════════
      # ALARM PANEL
