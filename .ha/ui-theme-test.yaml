            content: >
              ## Very Dark Black — Theme Test Dashboard

              All major HA UI element types and states in one place. Use **Developer
              Tools → YAML → Reload Lovelace** to refresh after theme changes. Each
              section is labelled with what it exercises.

          - type: markdown
            title: "More Info Dialog — card-mod-more-info"
            content: >
              **Tap any entity** to open its More Info dialog and test: heading ink
              color (`#ffffff` override), dialog surface background (pure black),
              scrim/backdrop (`rgba(0,0,0,0.9)`), on-surface text contrast, form
              controls inside dialogs (input backgrounds, selects, sliders), and the
              number / cover / climate / alarm detail views.

          - type: heading
            heading: Heading Card — title style with entity badges
            heading_style: title
            icon: mdi:card-text-outline
            badges:
