        title: Heading & Text Styles
        content: |
          ## Heading 2
          ### Heading 3
          #### Heading 4

          Normal paragraph text. **Bold text.** *Italic text.* `inline code`.

          > Blockquote text — should look distinct from body copy.

          ---

          Unordered list:
          - Item one
          - Item two
          - Item three

          Ordered list:
          1. First item
          2. Second item
          3. Third item

          | Column A | Column B | Column C |
          |----------|----------|----------|
          | Value 1  | Value 2  | Value 3  |
          | Value 4  | Value 5  | Value 6  |

          ```yaml
          # Fenced code block — markdown-code-background-color token
          sensor:
            - name: Example
              state: "{{ states('input_number.mock_volume_level') }}"
          ```

          Link: [Home Assistant](https://www.home-assistant.io)

  # ══════════════════════════════════════════════════════════════════════════
  # VIEW 4 — Theme Comparison (sections — two columns, side by side)
  # Left: no theme (inherits system default)   Right: Black with Cyan
  # Set system theme to Home Assistant Default to compare unstyled vs Cyan.
  # ══════════════════════════════════════════════════════════════════════════
  - title: Compare
    icon: mdi:compare
    type: sections
    max_columns: 2

    header:
      card:
        type: markdown
        content: |-
          ## Compare — Default Theme vs Black with Cyan

          **Left column** — system default theme (no override).
          **Right column** — `Black with Cyan` applied at section level.
          Set the system theme to **Home Assistant Default** to see
          the unstyled vs themed comparison side by side.
        title: Compare — Default Theme vs Black with Cyan
        text_only: true

    badges:
      - type: entity
        entity: binary_sensor.internet_connectivity
        show_name: true
        name: Internet
      - type: entity
        entity: alarm_control_panel.home_alarm
        show_name: true
        name: Alarm
      - type: entity
        entity: sensor.kitchen_temperature
        show_name: true
        name: Kitchen
      - type: entity
        entity: binary_sensor.mock_problem_alert
        show_name: true
        name: Problem
      - type: entity
        entity: switch.smart_plug_tv
        show_name: true
        name: TV

