# Validation stub for the Very Dark Black HA Theme project.
# Delegates all validation to the shared workflow in PlayFaster/.github.

name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main — update SHA after pushing .github changes v2.0.8
    uses: PlayFaster/.github/.github/workflows/validate.yaml@1592e2cf8aecff305989027541fdc468688b47d3
    with:
      category: theme
