---
# Workflow runs validations specifically for Home Assistant Themes.
# It contains multiple independent jobs (HACS, Linting, Structure,
# Codespell, Zizmor), and generates a SINGLE workflow badge for the README.

name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Official HACS metadata validation.
  # Checks hacs.json ensures repository meets HACS Themes requirements.
  hacs_val:
    name: "HACS Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Tag @v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: HACS Validation
        # Branch @main
        uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485
        with:
          # category is set to 'theme' specifically for this workflow
          category: theme

  # Job 2: File-level integrity (JSON, YAML, Markdown, and Prettier).
  # Ensures the HACS manifest is valid and the README is high quality.
  lint_val:
    name: "File Contents Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Tag @v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        # Tag @v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: JSON Schema Check
        # Validates hacs.json against the provided schema using standard pip.
        run: |
          pip install check-jsonschema==0.37.2
          check-jsonschema --schemafile .validate/hacs_schema.json hacs.json

      - name: YAML Check
        # Ensures theme YAML and GitHub Action files are syntactically correct.
        # Tag @v3
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c
        with:
          file_or_dir: .
          config_file: .validate/.yamllint

      - name: Prettier Format Check
        run: |
          npm install prettier@3.6.2 prettier-plugin-sort-json@4.2.0
          npx prettier --config .validate/.prettierrc.json --check "**/*.{md,json,yaml,yml}"

      - name: Check README Links
        # Validates that all external links in the README are still alive.
        # Tag @v1
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368
        with:
          base-branch: main
          file-path: README.md

  # Job 3: Theme-specific structural validation.
  # Ensures the repository layout matches HACS expectations for themes.
  structure_val:
    name: "Structure Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Tag @v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify Theme Location
        # HACS requires theme YAML files to be inside the /themes/ directory.
        run: |
          if [ ! -f themes/*.yaml ]; then
            echo "Error: Theme file must be inside the /themes folder for HACS!"
            exit 1
          fi

  # Job 4: Spell checking.
  codespell:
    name: "Codespell"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Tag @v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run Codespell
        # Tag @v2
        uses: codespell-project/actions-codespell@406322ec52dd7b488e48c1c4b82e2a8b3a1bf630
        with:
          # Config lives in .validate/ rather than repo root.
          path_to_config_file: .validate/.codespellrc

  # Job 5: GitHub Actions workflow security audit.
  # Known findings exist — step is non-blocking until resolved.
  zizmor:
    name: "Zizmor (Workflow Security)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        # Tag @v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Zizmor
        run: pip install zizmor==1.25.2

      - name: Run Zizmor
        continue-on-error: true
        run: zizmor --pedantic .github/
