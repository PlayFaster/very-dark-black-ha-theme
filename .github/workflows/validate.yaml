---
name: Validate

'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"  # Daily

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. HACS Validation (Official HACS metadata check)
      - name: HACS Validate
        uses: hacs/action@main
        with:
          category: theme

      # 2. JSON Schema Validation (Mirroring local validation)
      - name: JSON Schema Check
        run: |
          pip install check-jsonschema
          check-jsonschema --schemafile .validate/hacs_schema.json hacs.json

      # 3. YAML Linting (Broadened scope to match local tasks)
      - name: YAML Check
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: "{extends: relaxed, rules: {line-length: {max: 120}}}"

      # 4. Markdown Link Check (Ensures README links are alive)
      - name: Check README Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          base-branch: main
          file-path: README.md

      # 5. Structural Check (Verifies theme is in the correct folder)
      - name: Verify Theme Location
        run: |
          if [ ! -f themes/*.yaml ]; then
            echo "Error: Theme file must be inside the /themes folder for HACS!"
            exit 1
          fi
