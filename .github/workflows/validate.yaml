---
name: Validate

'on':
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"  # Daily

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: HACS Validation
        continue-on-error: true
        uses: hacs/action@main
        with:
          category: theme
