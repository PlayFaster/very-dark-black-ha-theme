---
# Validation stub for the Very Dark Black HA Theme project.
# Delegates all validation to the shared workflow in PlayFaster/.github.

name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main v2.0.0 — update SHA after pushing .github changes
    uses: PlayFaster/.github/.github/workflows/validate.yaml@a271f4e4b2b04130624282e6f43bb31e2f2dc55a
    with:
      category: theme
    secrets: inherit
