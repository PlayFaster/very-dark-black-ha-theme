# Validation stub for the Very Dark Black HA Theme project.
# Delegates all validation to the shared workflow in PlayFaster/.github.

name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main v2.0.4 — update SHA after pushing .github changes
    uses: PlayFaster/.github/.github/workflows/validate.yaml@553c5646db65c5c93d325aa1cb32fc91223c9c4e
    with:
      category: theme
